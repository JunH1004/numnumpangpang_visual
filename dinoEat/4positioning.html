<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경쟁 포지셔닝 매트릭스</title>
<style>
  /* CSS Reset & Basic Setup */
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }
  
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: #FFFFFF;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 28px;
    color: #0F1A14;
  }

  /* Document Container */
  .document-infographic {
    width: 1000px;
    background-color: #F7F8FA;
    border: 1.2px solid #D1D5DB;
    border-radius: 16px;
    padding: 48px;
    box-shadow: 0 4px 16px rgba(15,26,20,0.04);
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  /* Header Section */
  .header {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: center;
  }
  
  .title {
    font-size: 40px;
    font-weight: 800;
    color: #0F1A14;
    letter-spacing: 0;
    line-height: 1.2;
  }
  
  .subtitle {
    font-size: 19px;
    font-weight: 500;
    color: #374151;
    line-height: 1.65;
    max-width: 820px;
    margin: 0 auto;
    word-break: keep-all;
  }
  
  .subtitle strong {
    color: #16A34A;
    font-weight: 700;
  }

  /* Matrix Layout */
  .matrix-layout {
    display: flex;
    flex-direction: column;
    position: relative;
    padding-right: 12px;
  }

  .matrix-main {
    display: flex;
    align-items: stretch;
  }

  /* Y Axis */
  .y-axis {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 52px;
    margin-right: 18px;
    color: #374151;
    font-size: 15px;
    font-weight: 700;
  }
  
  .y-axis-line {
    flex: 1;
    width: 1.5px;
    background: #CBD5E1;
    position: relative;
    margin: 12px 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .y-axis-line::before {
    content: '';
    position: absolute;
    top: -6px;
    left: -4.5px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 6px solid #CBD5E1;
  }
  
  .y-axis-title {
    writing-mode: vertical-rl;
    text-align: center;
    letter-spacing: 0;
    background: #F7F8FA;
    padding: 18px 0;
    color: #0F1A14;
    font-weight: 800;
    font-size: 18px;
  }

  /* Grid Container */
  .grid-container {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    height: 620px;
    gap: 2px;
    background: #D1D5DB;
    border: 1.2px solid #D1D5DB;
    border-radius: 16px;
    overflow: hidden;
  }

  /* Grid Cells */
  .cell {
    background: #FFFFFF;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    position: relative;
  }

  /* Green/Gray Heatmap */
  .cell.level-0 { background-color: #FFFFFF; }
  .cell.level-1 { background-color: #F3F4F6; }
  .cell.level-2 { background-color: #ECFDF5; }
  .cell.level-3 { background-color: #DCFCE7; }
  .cell.level-4 { background-color: #BBF7D0; }

  /* Item Cards */
  .item-card {
    background: #FFFFFF;
    border: 1.2px solid #D1D5DB;
    border-radius: 12px;
    padding: 20px 18px;
    width: 100%;
    max-width: 220px;
    box-shadow: 0 4px 16px rgba(15,26,20,0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    z-index: 2;
  }
  
  .item-card .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  
  /* Unified Green Palette */
  .dot.blue { background-color: #166534; }
  .dot.orange { background-color: #16A34A; }
  .dot.green { background-color: #22C55E; }
  .dot.red { background-color: #15803D; }

  .item-card .card-text {
    font-size: 18px;
    font-weight: 700;
    color: #1F2937;
    line-height: 1.45;
    word-break: keep-all;
  }

  /* Brand Hero Card */
  .brand-card {
    background: #0F1A14;
    border: 1.2px solid #0F1A14;
    border-radius: 12px;
    padding: 26px 20px;
    width: 100%;
    max-width: 228px;
    box-shadow: 0 8px 24px rgba(15,26,20,0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    z-index: 2;
    transform: scale(1.03);
  }
  
  .brand-card .brand-title {
    font-size: 26px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 0;
  }
  
  .brand-card .brand-desc {
    font-size: 16px;
    font-weight: 600;
    color: #E5E7EB;
    line-height: 1.45;
    word-break: keep-all;
  }

  /* X Axis */
  .x-axis-wrapper {
    margin-left: 72px;
    margin-top: 22px;
  }
  
  .x-axis {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #374151;
    font-size: 15px;
    font-weight: 700;
  }
  
  .x-axis-line {
    flex: 1;
    height: 1.5px;
    background: #CBD5E1;
    position: relative;
    margin: 0 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .x-axis-line::after {
    content: '';
    position: absolute;
    right: -6px;
    top: -4.5px;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 6px solid #CBD5E1;
  }
  
  .x-axis-title {
    background: #F7F8FA;
    padding: 0 16px;
    letter-spacing: 0;
    color: #0F1A14;
    font-weight: 800;
    font-size: 18px;
  }
</style>
</head>
<body>

<div class="document-infographic">
  
  <!-- Section: Header -->
  <div class="header">
    <div class="title">경쟁 포지셔닝 매트릭스</div>
    <div class="subtitle">기존 대안은 즉시성 또는 행동 변화 유도력 중 하나에 치우쳐 있으나,<br><strong>냠냠팡팡은 두 요소를 동시에 충족하는 포지션</strong>으로 설계됩니다.</div>
  </div>

  <!-- Section: Grid Matrix -->
  <div class="matrix-layout">
    <div class="matrix-main">
      
      <!-- Y Axis -->
      <div class="y-axis">
        <span>높음</span>
        <div class="y-axis-line">
          <span class="y-axis-title">바람직한 식사 행동 형성력</span>
        </div>
        <span>낮음</span>
      </div>

      <!-- 3x3 Heatmap Grid -->
      <div class="grid-container">
        
        <!-- Row 1 (Y: High) -->
        <div class="cell level-2">
          <div class="item-card">
            <div class="dot blue"></div>
            <div class="card-text">부모 코칭 /<br>식단계획 앱</div>
          </div>
        </div>
        <div class="cell level-3"></div>
        <div class="cell level-4">
          <!-- Target Sweet Spot -->
          <div class="brand-card">
            <div class="brand-title">냠냠팡팡</div>
            <div class="brand-desc">실시간 개입과<br>행동 형성의 동시 충족</div>
          </div>
        </div>

        <!-- Row 2 (Y: Mid) -->
        <div class="cell level-1"></div>
        <div class="cell level-2">
          <div class="item-card">
            <div class="dot orange"></div>
            <div class="card-text">식판 스캔 /<br>반응형 식사 콘텐츠</div>
          </div>
        </div>
        <div class="cell level-3"></div>

        <!-- Row 3 (Y: Low) -->
        <div class="cell level-0">
          <div class="item-card">
            <div class="dot green"></div>
            <div class="card-text">식사 기록 /<br>영양관리 앱</div>
          </div>
        </div>
        <div class="cell level-1"></div>
        <div class="cell level-2">
          <div class="item-card">
            <div class="dot red"></div>
            <div class="card-text">식사 중 영상 /<br>키즈 엔터테인먼트</div>
          </div>
        </div>

      </div>
    </div>

    <!-- X Axis -->
    <div class="x-axis-wrapper">
      <div class="x-axis">
        <span>낮음</span>
        <div class="x-axis-line">
          <span class="x-axis-title">실시간 개입성</span>
        </div>
        <span>높음</span>
      </div>
    </div>
    
  </div>
</div>

</body>
</html>
